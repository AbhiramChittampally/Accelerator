
name: Week 7 Python Tests

# Events that trigger this workflow
on:
  push:
  pull_request:

jobs:
  test:
    name: Run pytest suite
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Step 3: Install project dependencies
      - name: Install dependencies
        working-directory: CICD_GitGithub_MLOPS/testingweek7
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Step 4: Execute tests and measure coverage
      - name: Run tests with coverage
        working-directory: CICD_GitGithub_MLOPS/testingweek7
        run: |
          python -m pytest -v --cov=src --cov-branch --cov-report=term-missing
