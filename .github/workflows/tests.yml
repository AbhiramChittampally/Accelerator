
name: Week 7 ML CI Pipeline

"on":
  push:
  pull_request:
jobs:
  quality-and-tests:
    name: Quality Gates and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: CICD_GitGithub_MLOPS/testingweek7
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ruff lint
        working-directory: CICD_GitGithub_MLOPS/testingweek7
        run: |
          python -m ruff check src tests mlflow_lab

      - name: Black format check
        working-directory: CICD_GitGithub_MLOPS/testingweek7
        run: |
          python -m black --check src tests mlflow_lab

      - name: Mypy type check
        working-directory: CICD_GitGithub_MLOPS/testingweek7
        run: |
          python -m mypy --config-file pyproject.toml src

      - name: Run pytest with coverage
        working-directory: CICD_GitGithub_MLOPS/testingweek7
        run: |
          python -m pytest -v --cov=src --cov=mlflow_lab --cov-branch --cov-report=term-missing
