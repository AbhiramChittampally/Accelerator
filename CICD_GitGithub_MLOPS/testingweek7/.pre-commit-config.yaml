
repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint
        entry: python -m ruff check CICD_GitGithub_MLOPS/testingweek7/src
        language: system
        pass_filenames: false

      - id: black
        name: Black format check
        entry: python -m black --check CICD_GitGithub_MLOPS/testingweek7/src
        language: system
        pass_filenames: false

      - id: mypy
        name: Mypy type check
        entry: python -m mypy --config-file CICD_GitGithub_MLOPS/testingweek7/pyproject.toml CICD_GitGithub_MLOPS/testingweek7/src
        language: system
        pass_filenames: false
